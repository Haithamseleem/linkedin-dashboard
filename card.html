<style>

        if (it.sub) txt.append(el('div', 'sub', it.sub));
        row.append(ico, txt);
        list.append(row);
        return { ico, lbl, it };
      });
      c.append(list);
      return () => {
        rows.forEach(({ ico }) => { const b = box(ico, 4); draw(rcInk().circle(b.cx, b.cy, b.w * 1.02, o({ strokeWidth: 3 }))); });
        for (let i = 0; i < rows.length - 1; i++) {
          const p = box(rows[i].ico), q = box(rows[i + 1].ico);
          arrow(p.cx - 30, p.y + p.h + 6, q.cx - 30, q.y - 6, COL.ink, 0.35);
        }
        const bad = rows.find((r) => r.it.flag === '!' || r.it.flag === '✕');
        if (bad) {
          circleAround(bad.lbl, COL.note, 24, true);
          note(d.note, bad.lbl, 'above-right');
        }
      };
    },
    checklist(c, d, items) {
      const right = sideArt(d);
      headline(d.headline, 300, 100, 58, right);
      c.style.top = '500px';
      const list = el('div', 'checks');
      const rows = items.slice(0, 5).map((raw) => {
        const it = parseItem(raw);
        const row = el('div', 'check');
        const bx = el('div', 'bx');
        const ct = el('div', 'ct', it.text);
        row.append(bx, ct);
        list.append(row);
        return { bx, ct, it };
      });
      c.append(list);
      return () => {
        rows.forEach(({ bx, ct, it }) => {
          const b = box(bx);
          draw(rcInk().rectangle(b.x, b.y, b.w, b.h, o({ strokeWidth: 3 })));
          if (it.flag === '!') {
            draw(rcInk().line(b.cx, b.y + 10, b.cx, b.y + b.h - 22, o({ stroke: COL.yellow, strokeWidth: 7 })));
            draw(rcInk().circle(b.cx, b.y + b.h - 10, 7, solid(COL.yellow, { stroke: COL.yellow })));
          } else if (it.flag === '✕') {
            draw(rcInk().line(b.x + 10, b.y + 10, b.x + b.w - 10, b.y + b.h - 10, o({ stroke: COL.red, strokeWidth: 6 })));
            draw(rcInk().line(b.x + b.w - 10, b.y + 10, b.x + 10, b.y + b.h - 10, o({ stroke: COL.red, strokeWidth: 6 })));
          } else {
            draw(rcInk().path(`M${b.x + 8} ${b.cy} L${b.x + 24} ${b.y + b.h - 6} L${b.x + b.w + 12} ${b.y - 14}`, o({ stroke: COL.blue, strokeWidth: 7 })));
          }
          if (it.flag === '!' || it.flag === '✕') {
            const t = box(ct);
            draw(rcInk().line(t.x, t.y + t.h - 4, t.x + Math.min(t.w, 720), t.y + t.h - 4, o({ stroke: COL.note, strokeWidth: 4 })));
          }
        });
        const warn = rows.find((r) => r.it.flag === '!' || r.it.flag === '✕');
        if (warn && d.note) note(d.note, warn.ct, 'below');
      };
    },
    versus(c, d, items) {
      headline(d.headline, 260, 104, 60);
      c.style.top = '470px';
      const grid = el('div', 'vs');
      const sides = [0, 2].map((i, k) => {
        const t = parseItem(items[i] || '');
        const side = el('div', 'side');
        side.append(shape(t.art || (k ? 'agent' : 'human'), 240));
        const st = el('div', 'st', t.label || t.text);
        side.append(st, el('div', 'sx', items[i + 1] || ''));
        grid.append(side);
        return { st };
      });
      const v = el('div', 'vsx', 'vs');
      c.append(grid, v);
      return () => {
        const g = box(grid);
        draw(rcInk().line(g.cx, g.y + 130, g.cx + 6, g.y + g.h, o({ strokeWidth: 3 })));
        const vb = box(v);
        draw(rcInk().circle(vb.cx, vb.cy, 96, o({ fill: COL.hi, fillStyle: 'solid', strokeWidth: 3 })));
        ink().appendChild(svgText(vb.cx, vb.cy + 18, 'vs', 56));
        const s = box(sides[1].st, 2);
        draw(rcInk().line(s.x, s.y + s.h, s.x + s.w, s.y + s.h + 4, o({ stroke: COL.note, strokeWidth: 5 })));
        if (d.note) note(d.note, sides[1].st, 'below');
      };
    },
    alert(c, d, items) {
      const right = sideArt(d);
      headline(d.headline, 290, 100, 58, right);
      c.style.top = '490px';
      const [type = 'E', msg = '', ...rows] = items;
      const win = el('div', 'win');
      const bar = el('div', 'bar');
      const dots = el('div', 'dots');
      const dd = [el('i'), el('i'), el('i')];
      dots.append(...dd);
      bar.append(dots, el('span', '', d.label || 'System'));
      const form = el('div', 'form');
      const vals = rows.slice(0, 4).map((r) => {
        const [k, ...v] = r.split(':');
        const row = el('div', 'frow');
        const fv = el('div', 'fv', v.join(':').trim());
        row.append(el('div', 'fl', k.trim()), fv);
        form.append(row);
        return fv;
      });
      const t = String(type).trim().toUpperCase()[0] || 'E';
      const status = el('div', 'status');
      const ic = el('div', 'ic', t === 'S' ? '✓' : '!');
      status.append(ic, el('span', '', msg));
      win.append(bar, form, status);
      c.append(win);
      return () => {
        const w = box(win);
        draw(rcInk().rectangle(w.x, w.y, w.w, w.h, o({ strokeWidth: 3.6 })));
        const b = box(bar);
        draw(rcInk().line(w.x, b.y + b.h, w.x + w.w, b.y + b.h, o({ strokeWidth: 3 })));
        dd.forEach((i) => { const x = box(i); draw(rcInk().circle(x.cx, x.cy, 18, o({ strokeWidth: 2.5 }))); });
        vals.forEach((v) => { const x = box(v); draw(rcInk().line(x.x, x.y + x.h, x.x + x.w, x.y + x.h, o({ strokeWidth: 2.4 }))); });
        const s = box(status);
        const tone = t === 'S' ? COL.blue : t === 'W' ? COL.yellow : COL.red;
        draw(rcInk().rectangle(s.x, s.y, s.w, s.h, solid(COL.hi, { stroke: tone, strokeWidth: 6 })));
        status.style.position = 'relative';
        status.style.zIndex = '2';
        const ib = box(ic);
        draw(rcInk().circle(ib.cx, ib.cy, 64, solid(tone, { strokeWidth: 3 })));
        ic.style.color = COL.bg;
        if (d.note) note(d.note, status, 'below');
      };
    },
  };

  window.renderCard = async (d) => {
    document.querySelectorAll('.note, body > .art, body > div[style]').forEach((n) => { if (!n.classList.contains('content')) n.remove(); });
    ink().replaceChildren();
    const alias = { kraft: 'blueprint', chalk: 'board', night: 'board', forest: 'board' };
    const theme = ['paper', 'blueprint', 'board'].includes(d.theme) ? d.theme : alias[d.theme] || 'paper';
    document.body.className = theme;
    document.getElementById('dotgrid').style.display = theme === 'paper' ? '' : 'none';
    document.getElementById('linegrid').style.display = theme === 'blueprint' ? '' : 'none';
    document.getElementById('chalkdust').style.display = theme === 'board' ? '' : 'none';
    const s = getComputedStyle(document.body);
    COL = Object.fromEntries(['ink', 'soft', 'hi', 'red', 'blue', 'teal', 'brown', 'yellow', 'note', 'bg'].map((k) => [k, s.getPropertyValue(`--${k}`).trim()]));
    seed = 7 + String(d.headline || '').length;
    await Promise.all([document.fonts.load('700 40px Kalam'), document.fonts.load('400 40px Kalam'), document.fonts.load('700 40px Caveat')]).catch(() => {});
    await document.fonts.ready;
    document.getElementById('kicker').textContent = d.kicker || '';
    const label = document.getElementById('label');
    label.textContent = d.label || '';
    label.hidden = !d.label;
    document.getElementById('footer').textContent = d.footer || '';
    const cta = document.getElementById('cta');
    cta.textContent = d.cta || '';
    cta.hidden = !d.cta;
    const flags = document.getElementById('flags');
    flags.replaceChildren(...String(d.flags || '').split(',').map((x) => x.trim().toLowerCase()).filter((x) => FLAGS.includes(x)).slice(0, 4).map((code, i) => {
      const img = el('img');
      img.src = `card-assets/flags/${code}.svg`;
      img.alt = code;
      img.style.transform = `rotate(${[-4, 3, -2, 4][i]}deg)`;
      return img;
    }));
    await Promise.all([...flags.querySelectorAll('img')].map((img) => (img.complete ? null : new Promise((r) => { img.onload = img.onerror = r; }))));
    const c = document.getElementById('content');
    c.replaceChildren();
    c.style.top = '';
    const items = String(d.items || '').split('|').map((x) => x.trim()).filter(Boolean);
    const layout = LAYOUTS[d.layout] ? d.layout : 'question';
    const after = LAYOUTS[layout](c, d, items);
    await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
    if (label.textContent) { const b = box(label); draw(rcInk().rectangle(b.x, b.y, b.w, b.h, o({ strokeWidth: 3 }))); }
    if (cta.textContent) { const b = box(cta, 6); draw(rcInk().ellipse(b.cx, b.cy, b.w * 1.08, b.h * 1.5, o({ stroke: COL.note, strokeWidth: 3.4, roughness: 1.7 }))); }
    flags.querySelectorAll('img').forEach((img) => { const b = box(img, 3); draw(rcInk().rectangle(b.x, b.y, b.w, b.h, o({ strokeWidth: 2.4, roughness: 1.6 }))); });
    if (after) after();
    const ft = document.getElementById('footer');
    fit(ft, 28, 20);
    if (ft.scrollWidth > ft.clientWidth + 1) ft.style.visibility = 'hidden';
    else ft.style.visibility = '';
    window.cardReady = true;
  };
  const fromHash = () => { if (location.hash.length > 1) window.renderCard(JSON.parse(decodeURIComponent(location.hash.slice(1)))); };
  window.addEventListener('hashchange', fromHash);
  fromHash();
</script>
</body>
