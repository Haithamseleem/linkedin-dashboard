<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1080px; height: 1350px; }
  body { position: relative; overflow: hidden; background: var(--bg); color: var(--ink); font-family: Inter, "Segoe UI", system-ui, sans-serif; }
  body.night { --bg: #0a1322; --ink: #ffffff; --sub: rgba(220,230,245,.8); --accent: #ffb23d; --accent2: #2f7bff; --soft: #3a5a8c; --soft2: #4f70a6; --line: rgba(47,123,255,.38); --bad: #ff5a4f; --warn: #ffb23d; --good: #3ccf8e; --panel: rgba(255,255,255,.06); --pline: rgba(255,255,255,.16); --glow1: rgba(47,123,255,.28); --glow2: rgba(255,178,61,.24); }
  body.paper { --bg: #f4ecdf; --ink: #2f2118; --sub: #6b5442; --accent: #9a5b2e; --accent2: #c9935f; --soft: #dfc59c; --soft2: #b48d63; --line: rgba(139,90,51,.22); --bad: #b0412f; --warn: #b3741b; --good: #4f6b2c; --panel: #fffaf1; --pline: #dcc9ab; --glow1: rgba(201,147,95,.28); --glow2: rgba(154,91,46,.16); }
  body.forest { --bg: #0e2620; --ink: #f6f1e4; --sub: rgba(232,226,206,.8); --accent: #e0b04f; --accent2: #4fa38a; --soft: #3b6d5d; --soft2: #4f8a76; --line: rgba(224,176,79,.26); --bad: #ff6b57; --warn: #e0b04f; --good: #7fd1a8; --panel: rgba(255,255,255,.06); --pline: rgba(255,255,255,.16); --glow1: rgba(79,163,138,.3); --glow2: rgba(224,176,79,.22); }
  .glow { position: absolute; inset: 0; background: radial-gradient(900px 800px at 0% 0%, var(--glow1), transparent 60%), radial-gradient(900px 700px at 92% 98%, var(--glow2), transparent 60%); }
  #grid { position: absolute; left: 0; bottom: 0; width: 1080px; height: 520px; }
  #grid line { stroke: var(--line); stroke-width: 1.5; }
  .top { position: absolute; left: 80px; right: 80px; top: 96px; display: flex; align-items: center; gap: 18px; }
  .bar { width: 72px; height: 8px; border-radius: 4px; background: var(--accent); flex: none; }
  .kicker { font-weight: 600; font-size: 32px; color: var(--accent); flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .label { flex: none; border: 2px solid var(--pline); color: var(--ink); border-radius: 999px; padding: 8px 22px; font-weight: 700; font-size: 26px; letter-spacing: .01em; }
  .headline { position: absolute; left: 80px; right: 80px; top: 168px; font-weight: 800; letter-spacing: -0.025em; line-height: 1.04; overflow: hidden; }
  .headline em { font-style: normal; color: var(--accent); }
  .content { position: absolute; left: 80px; right: 80px; }
  .footer { position: absolute; left: 80px; right: 80px; bottom: 60px; display: flex; align-items: center; gap: 20px; font-size: 27px; font-weight: 500; color: var(--sub); }
  .footer .ft { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .footer .cta { flex: none; font-weight: 700; color: var(--ink); background: var(--panel); border: 2px solid var(--pline); border-radius: 999px; padding: 10px 24px; }
  svg.art { display: block; overflow: visible; }
  .a { fill: var(--accent); } .b { fill: var(--accent2); } .s { fill: var(--soft); } .t { fill: var(--soft2); } .i { fill: var(--ink); } .k { fill: var(--bg); }
  .ln { fill: none; stroke: var(--ink); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
  .la { fill: none; stroke: var(--accent); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
  .lb { fill: none; stroke: var(--accent2); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
  .lt { fill: none; stroke: var(--soft2); stroke-width: 6; stroke-linecap: round; }
  .tx { fill: var(--bg); font: 800 15px Inter, sans-serif; }

  /* scene (question layout) */
  .scene { position: absolute; left: 40px; right: 40px; bottom: 130px; height: 430px; }
  .scene .route { position: absolute; inset: 0; }
  .scene .route path { fill: none; stroke: var(--accent); stroke-width: 6; stroke-dasharray: 2 18; stroke-linecap: round; }
  .scene .slot { position: absolute; bottom: 0; }
  .badge { position: absolute; width: 74px; height: 74px; border-radius: 50%; background: var(--bad); color: #fff; display: grid; place-items: center; font: 800 44px Inter, sans-serif; box-shadow: 0 0 0 10px color-mix(in srgb, var(--bad) 25%, transparent); }

  /* flow */
  .steps { display: grid; gap: 26px; }
  .step { display: grid; grid-template-columns: 150px 1fr; align-items: center; gap: 34px; position: relative; }
  .step .node { width: 150px; height: 150px; border-radius: 50%; background: var(--panel); border: 4px solid var(--pline); display: grid; place-items: center; position: relative; }
  .step.bad .node { border-color: var(--bad); box-shadow: 0 0 0 12px color-mix(in srgb, var(--bad) 20%, transparent); }
  .step .node .badge { width: 54px; height: 54px; font-size: 32px; right: -10px; top: -10px; }
  .step .lbl { font-size: 46px; font-weight: 700; line-height: 1.15; }
  .step .sub { font-size: 30px; font-weight: 500; color: var(--sub); margin-top: 6px; }
  .step:not(:last-child)::after { content: ""; position: absolute; left: 73px; top: 156px; height: 22px; border-left: 4px dashed var(--accent); }

  /* checklist */
  .checks { display: grid; gap: 24px; }
  .check { display: grid; grid-template-columns: 64px 1fr; gap: 28px; align-items: center; background: var(--panel); border: 2px solid var(--pline); border-radius: 22px; padding: 22px 28px; }
  .mark { width: 64px; height: 64px; border-radius: 16px; display: grid; place-items: center; font: 800 38px Inter, sans-serif; color: var(--bg); background: var(--good); }
  .check.warn .mark { background: var(--warn); }
  .check.bad .mark { background: var(--bad); color: #fff; }
  .check .ct { font-size: 40px; font-weight: 600; line-height: 1.2; }

  /* versus */
  .vs { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  .side { background: var(--panel); border: 3px solid var(--pline); border-radius: 28px; padding: 34px 30px; display: flex; flex-direction: column; align-items: flex-start; gap: 18px; min-height: 640px; }
  .side.b { border-color: var(--accent); }
  .side .st { font-size: 46px; font-weight: 800; letter-spacing: -0.01em; }
  .side.b .st { color: var(--accent); }
  .side .sx { font-size: 34px; font-weight: 500; line-height: 1.3; color: var(--sub); }
  .vs-mid { position: absolute; left: 50%; top: 150px; transform: translateX(-50%); width: 92px; height: 92px; border-radius: 50%; background: var(--accent); color: var(--bg); display: grid; place-items: center; font: 800 34px Inter, sans-serif; }

  /* system message */
  .screen { background: var(--panel); border: 3px solid var(--pline); border-radius: 26px; overflow: hidden; }
  .chrome { display: flex; align-items: center; gap: 12px; padding: 20px 26px; border-bottom: 2px solid var(--pline); font-size: 26px; font-weight: 700; color: var(--sub); }
  .chrome i { width: 18px; height: 18px; border-radius: 50%; background: var(--pline); display: inline-block; }
  .chrome span { margin-left: 10px; }
  .form { padding: 30px 30px 12px; display: grid; gap: 18px; }
  .frow { display: grid; grid-template-columns: 300px 1fr; gap: 22px; align-items: center; font-size: 32px; }
  .frow .fl { color: var(--sub); font-weight: 600; }
  .frow .fv { background: color-mix(in srgb, var(--bg) 55%, transparent); border: 2px solid var(--pline); border-radius: 12px; padding: 12px 18px; font-weight: 600; font-family: "Cascadia Mono", Consolas, monospace; font-size: 29px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status { margin-top: 18px; display: grid; grid-template-columns: 60px 1fr; gap: 20px; align-items: center; padding: 24px 28px; background: color-mix(in srgb, var(--bad) 18%, transparent); border-top: 3px solid var(--bad); font-size: 34px; font-weight: 700; line-height: 1.25; }
  .status.W { background: color-mix(in srgb, var(--warn) 18%, transparent); border-top-color: var(--warn); }
  .status.S { background: color-mix(in srgb, var(--good) 18%, transparent); border-top-color: var(--good); }
  .status .ico { width: 60px; height: 60px; border-radius: 50%; display: grid; place-items: center; font: 800 34px Inter, sans-serif; color: #fff; background: var(--bad); }
  .status.W .ico { background: var(--warn); color: var(--bg); }
  .status.S .ico { background: var(--good); color: var(--bg); }
  .peek { position: absolute; right: 30px; bottom: 150px; }
</style>
</head>
<body class="night">
<div class="glow"></div>
<svg id="grid" viewBox="0 0 1080 520" xmlns="http://www.w3.org/2000/svg"></svg>
<div class="top"><div class="bar"></div><div class="kicker" id="kicker"></div><div class="label" id="label"></div></div>
<div class="headline" id="headline"></div>
<div class="content" id="content"></div>
<div class="footer"><div class="ft" id="footer"></div><div class="cta" id="cta"></div></div>
<script>
  const SHAPES = {
    agent: '<rect class="t" x="56" y="130" width="88" height="44" rx="20"/><rect class="s" x="88" y="112" width="24" height="22" rx="6"/><rect class="b" x="48" y="48" width="104" height="74" rx="26"/><rect class="k" x="62" y="64" width="76" height="40" rx="15"/><circle class="a" cx="86" cy="84" r="8"/><circle class="a" cx="114" cy="84" r="8"/><path class="ln" d="M100 48V30"/><circle class="a" cx="100" cy="24" r="8"/><rect class="a" x="40" y="74" width="10" height="22" rx="5"/><rect class="a" x="150" y="74" width="10" height="22" rx="5"/>',
    orb: '<ellipse class="lb" cx="100" cy="100" rx="78" ry="26" transform="rotate(-20 100 100)"/><ellipse class="lb" cx="100" cy="100" rx="78" ry="26" transform="rotate(35 100 100)"/><circle class="a" cx="100" cy="100" r="34"/><circle class="k" cx="88" cy="90" r="9" opacity=".35"/>',
    human: '<path class="t" d="M48 176c0-36 22-56 52-56s52 20 52 56z"/><circle class="s" cx="100" cy="80" r="32"/><path class="i" d="M66 78c0-22 14-36 34-36s34 14 34 36c-7-12-18-16-34-16s-27 4-34 16z" opacity=".9"/><path class="ln" d="M100 120v12"/><rect class="a" x="90" y="132" width="20" height="26" rx="4"/>',
    ship: '<path class="t" d="M10 126h180l-24 38H36z"/><rect class="a" x="34" y="102" width="28" height="24"/><rect class="b" x="64" y="102" width="28" height="24"/><rect class="s" x="94" y="102" width="28" height="24"/><rect class="b" x="48" y="78" width="28" height="24"/><rect class="a" x="78" y="78" width="28" height="24"/><rect class="s" x="136" y="70" width="32" height="56" rx="4"/><rect class="k" x="142" y="80" width="20" height="9" rx="2"/><rect class="i" x="148" y="54" width="8" height="16"/><path class="lb" d="M6 180c12 0 12-6 24-6s12 6 24 6 12-6 24-6 12 6 24 6 12-6 24-6 12 6 24 6 12-6 24-6 12 6 24 6"/>',
    truck: '<rect class="s" x="16" y="74" width="110" height="74" rx="7"/><rect class="a" x="26" y="86" width="90" height="12" rx="4"/><path class="b" d="M126 96h36l24 28v24h-60z"/><path class="k" d="M136 104h22l16 18h-38z"/><circle class="i" cx="50" cy="152" r="16"/><circle class="s" cx="50" cy="152" r="6"/><circle class="i" cx="156" cy="152" r="16"/><circle class="s" cx="156" cy="152" r="6"/>',
    car: '<path class="b" d="M18 134c0-13 9-19 22-21l23-23c6-6 13-9 23-9h36c10 0 17 3 23 10l19 21c15 2 24 9 24 22v11H18z"/><path class="k" d="M70 96h26v19H52zM104 96h19c6 0 9 2 12 6l11 13h-42z"/><circle class="i" cx="56" cy="146" r="16"/><circle class="s" cx="56" cy="146" r="6"/><circle class="i" cx="150" cy="146" r="16"/><circle class="s" cx="150" cy="146" r="6"/><rect class="a" x="166" y="122" width="14" height="8" rx="3"/>',
    plane: '<path class="b" d="M18 104c0-6 8-10 20-10h112c20 0 36 4 36 10s-16 10-36 10H38c-12 0-20-4-20-10z"/><path class="a" d="M96 96L66 46h20l44 50zM96 112l-30 50h20l44-50z"/><path class="a" d="M30 96l-12-28h14l20 28z"/><circle class="k" cx="160" cy="104" r="5"/><circle class="k" cx="142" cy="104" r="5"/><circle class="k" cx="124" cy="104" r="5"/>',
    warehouse: '<path class="t" d="M22 86l78-38 78 38v86H22z"/><path class="b" d="M12 90l88-48 88 48-9 9-79-42-79 42z"/><rect class="s" x="44" y="112" width="50" height="60"/><path class="lt" d="M44 126h50M44 140h50M44 154h50"/><rect class="a" x="110" y="140" width="30" height="32" rx="2"/><rect class="a" x="144" y="148" width="24" height="24" rx="2"/><rect class="s" x="124" y="118" width="26" height="22" rx="2"/>',
    factory: '<path class="t" d="M18 174V98l40 24V98l40 24V98l40 24V64h24v110z"/><rect class="a" x="32" y="138" width="22" height="18" rx="2"/><rect class="a" x="72" y="138" width="22" height="18" rx="2"/><rect class="a" x="112" y="138" width="22" height="18" rx="2"/><rect class="b" x="140" y="44" width="18" height="22"/><circle class="s" cx="160" cy="32" r="10" opacity=".8"/><circle class="s" cx="176" cy="20" r="7" opacity=".6"/>',
    po: '<path class="s" d="M46 20h78l32 32v128H46z"/><path class="t" d="M124 20v32h32z"/><rect class="b" x="60" y="38" width="48" height="22" rx="5"/><text class="tx" x="84" y="55" text-anchor="middle">PO</text><path class="lt" d="M62 82h78M62 102h78M62 122h54"/><circle class="la" cx="124" cy="152" r="18"/><path class="la" d="M116 152l6 6 11-12"/>',
    invoice: '<path class="s" d="M46 20h108v160l-14-10-14 10-14-10-14 10-14-10-14 10-14-10-14 10z"/><rect class="b" x="60" y="36" width="54" height="22" rx="5"/><text class="tx" x="87" y="53" text-anchor="middle">INV</text><path class="lt" d="M62 80h76M62 98h76M62 116h50"/><rect class="a" x="62" y="134" width="76" height="16" rx="4"/>',
    box: '<path class="t" d="M100 40l66 33v74l-66 33-66-33V73z"/><path class="s" d="M100 40l66 33-66 33-66-33z"/><path class="b" d="M100 106l66-33v74l-66 33z"/><path class="a" d="M74 53l66 33v22l-13 6V92L61 59z"/>',
    shield: '<path class="b" d="M100 22l62 23v47c0 41-27 70-62 86-35-16-62-45-62-86V45z"/><path class="k" opacity=".22" d="M100 38l46 17v37c0 31-20 54-46 66z"/><path class="la" stroke-width="13" d="M72 100l20 20 38-42"/>',
    calendar: '<rect class="s" x="34" y="44" width="132" height="126" rx="14"/><path class="b" d="M34 58c0-8 6-14 14-14h104c8 0 14 6 14 14v22H34z"/><rect class="i" x="64" y="28" width="12" height="30" rx="6"/><rect class="i" x="124" y="28" width="12" height="30" rx="6"/><rect class="t" x="50" y="94" width="22" height="18" rx="4"/><rect class="t" x="78" y="94" width="22" height="18" rx="4"/><rect class="t" x="106" y="94" width="22" height="18" rx="4"/><rect class="t" x="134" y="94" width="22" height="18" rx="4"/><rect class="t" x="50" y="120" width="22" height="18" rx="4"/><rect class="t" x="78" y="120" width="22" height="18" rx="4"/><rect class="a" x="106" y="120" width="22" height="18" rx="4"/><rect class="t" x="134" y="120" width="22" height="18" rx="4"/><rect class="t" x="50" y="146" width="22" height="16" rx="4"/><rect class="t" x="78" y="146" width="22" height="16" rx="4"/>',
    cart: '<path class="b" d="M60 70h110l-15 54H74z"/><rect class="a" x="84" y="50" width="26" height="28" rx="4"/><rect class="s" x="114" y="42" width="24" height="36" rx="4"/><path class="ln" stroke-width="8" d="M20 42h26l22 92h88"/><circle class="i" cx="82" cy="156" r="13"/><circle class="i" cx="146" cy="156" r="13"/>',
    data: '<path class="t" d="M44 46v100c0 11 25 20 56 20s56-9 56-20V46"/><ellipse class="b" cx="100" cy="46" rx="56" ry="20"/><path class="la" d="M44 80c0 11 25 20 56 20s56-9 56-20M44 114c0 11 25 20 56 20s56-9 56-20"/>',
    chart: '<rect class="s" x="32" y="110" width="30" height="60" rx="5"/><rect class="b" x="74" y="84" width="30" height="86" rx="5"/><rect class="a" x="116" y="54" width="30" height="116" rx="5"/><path class="la" stroke-width="8" d="M30 92l42-28 42 6 46-42"/><path class="a" d="M150 20l26 2-6 25z"/>',
  };
  const shape = (name, size) => `<svg class="art" width="${size}" height="${size}" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">${SHAPES[name] || SHAPES.orb}</svg>`;
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const parseItem = (raw) => {
    let s = String(raw).trim(); let flag = '';
    if (/^[!✕✓]/.test(s)) { flag = s[0]; s = s.slice(1).trim(); }
    const m = s.match(/^([a-z]+):\s*(.*)$/);
    const art = m && SHAPES[m[1]] ? m[1] : null;
    const text = art ? m[2] : s;
    const [label, sub] = text.split(/\s+—\s+|\s+-\s+(?=\S)/);
    return { flag, art, text, label, sub };
  };
  function fit(node, max, min) {
    let size = max;
    node.style.fontSize = size + 'px';
    while (size > min && (node.scrollHeight > node.clientHeight + 1 || node.scrollWidth > node.clientWidth + 1)) { size -= 2; node.style.fontSize = size + 'px'; }
  }
  function headline(text) {
    const h = document.getElementById('headline');
    h.replaceChildren();
    String(text || '').split(/(\*[^*]+\*)/).forEach((p) => h.append(/^\*[^*]+\*$/.test(p) ? el('em', '', p.slice(1, -1)) : document.createTextNode(p)));
    return h;
  }
  function peekTopRight(h, art) {
    if (!art) return;
    h.style.right = '300px';
    const p = el('div', 'peek');
    p.style.top = '180px'; p.style.right = '80px'; p.style.bottom = 'auto';
    const first = parseItem(String(art).split(',')[0]);
    p.innerHTML = shape(first.art || first.text, 200);
    document.body.append(p);
  }
  function drawGrid() {
    const g = document.getElementById('grid');
    const H = 520;
    let s = '';
    for (let j = -14; j <= 14; j++) s += `<line x1="540" y1="0" x2="${540 + j * 150}" y2="${H}"/>`;
    for (let k = 0; k < 15; k++) { const y = H / (1 + 0.45 * k); s += `<line x1="0" y1="${y}" x2="1080" y2="${y}"/>`; }
    g.innerHTML = `<defs><linearGradient id="fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></linearGradient><mask id="m"><rect width="1080" height="${H}" fill="url(#fade)"/></mask></defs><g mask="url(#m)">${s}</g>`;
  }

  const LAYOUTS = {
    question(c, d, items) {
      const h = headline(d.headline);
      h.style.height = '600px';
      const arts = String(d.art || 'agent').split(',').map((x) => x.trim()).filter(Boolean).slice(0, 3);
      const scene = el('div', 'scene');
      const n = arts.length;
      const size = n === 1 ? 400 : n === 2 ? 340 : 300;
      const span = 1000;
      const xs = arts.map((_, i) => (n === 1 ? span - size - 40 : (span - size) * (i / (n - 1))));
      if (n > 1) {
        const pts = xs.map((x) => `${x + size / 2},${430 - size * 0.55}`);
        scene.insertAdjacentHTML('beforeend', `<svg class="route" viewBox="0 0 1000 430" preserveAspectRatio="none"><path d="M${pts.join(' L')}"/></svg>`);
      }
      arts.forEach((raw, i) => {
        const it = parseItem(raw);
        const slot = el('div', 'slot');
        slot.style.left = `${xs[i]}px`;
        slot.innerHTML = shape(it.art || it.text, size);
        if (it.flag === '!' || it.flag === '✕') { const b = el('div', 'badge', '✕'); b.style.right = '10px'; b.style.top = '-10px'; slot.append(b); }
        scene.append(slot);
      });
      document.body.append(scene);
      fit(h, 150, 72);
    },
    flow(c, d, items) {
      const h = headline(d.headline);
      h.style.height = '280px';
      c.style.top = '480px';
      const list = el('div', 'steps');
      items.slice(0, 5).forEach((raw) => {
        const it = parseItem(raw);
        const row = el('div', `step${it.flag === '!' || it.flag === '✕' ? ' bad' : ''}`);
        const node = el('div', 'node');
        node.innerHTML = shape(it.art || 'po', 110);
        if (row.classList.contains('bad')) node.append(el('div', 'badge', '✕'));
        const txt = el('div');
        txt.append(el('div', 'lbl', it.label), it.sub ? el('div', 'sub', it.sub) : '');
        row.append(node, txt);
        list.append(row);
      });
      c.append(list);
      fit(h, 104, 60);
      if (items.length > 4) list.style.gap = '14px';
    },
    checklist(c, d, items) {
      const h = headline(d.headline);
      h.style.height = '300px';
      c.style.top = '500px';
      const list = el('div', 'checks');
      items.slice(0, 5).forEach((raw) => {
        const it = parseItem(raw);
        const cls = it.flag === '!' ? ' warn' : it.flag === '✕' ? ' bad' : '';
        const row = el('div', `check${cls}`);
        row.append(el('div', 'mark', it.flag === '!' ? '!' : it.flag === '✕' ? '✕' : '✓'), el('div', 'ct', it.text));
        list.append(row);
      });
      c.append(list);
      peekTopRight(h, d.art);
      fit(h, 100, 58);
      list.querySelectorAll('.ct').forEach((n) => { n.style.maxHeight = '100px'; n.style.overflow = 'hidden'; fit(n, 40, 28); });
    },
    versus(c, d, items) {
      const h = headline(d.headline);
      h.style.height = '260px';
      c.style.top = '470px';
      const grid = el('div', 'vs');
      [[0, 'a'], [2, 'b']].forEach(([i, cls]) => {
        const t = parseItem(items[i] || '');
        const side = el('div', `side ${cls}`);
        side.insertAdjacentHTML('beforeend', shape(t.art || (cls === 'a' ? 'human' : 'agent'), 230));
        side.append(el('div', 'st', t.label || t.text), el('div', 'sx', items[i + 1] || ''));
        grid.append(side);
      });
      c.append(grid);
      c.append(el('div', 'vs-mid', 'VS'));
      fit(h, 100, 58);
      grid.querySelectorAll('.sx').forEach((n) => { n.style.maxHeight = '260px'; n.style.overflow = 'hidden'; fit(n, 34, 24); });
    },
    alert(c, d, items) {
      const h = headline(d.headline);
      h.style.height = '280px';
      c.style.top = '500px';
      const [type = 'E', msg = '', ...rows] = items;
      const screen = el('div', 'screen');
      const chrome = el('div', 'chrome');
      chrome.append(el('i'), el('i'), el('i'), el('span', '', d.label || 'System message'));
      const form = el('div', 'form');
      rows.slice(0, 4).forEach((r) => {
        const [k, ...v] = r.split(':');
        const row = el('div', 'frow');
        row.append(el('div', 'fl', k.trim()), el('div', 'fv', v.join(':').trim()));
        form.append(row);
      });
      const t = String(type).trim().toUpperCase()[0] || 'E';
      const status = el('div', `status ${t}`);
      status.append(el('div', 'ico', t === 'S' ? '✓' : t === 'W' ? '!' : '✕'), el('div', '', msg));
      screen.append(chrome, form, status);
      c.append(screen);
      peekTopRight(h, d.art);
      fit(h, 100, 58);
    },
  };

  window.renderCard = async (d) => {
    document.querySelectorAll('.scene, .peek').forEach((n) => n.remove());
    const theme = ['night', 'paper', 'forest'].includes(d.theme) ? d.theme : 'night';
    document.body.className = theme;
    document.getElementById('kicker').textContent = d.kicker || '';
    const label = document.getElementById('label');
    label.textContent = d.label || '';
    label.hidden = !d.label;
    document.getElementById('footer').textContent = d.footer || '';
    const cta = document.getElementById('cta');
    cta.textContent = d.cta || '';
    cta.hidden = !d.cta;
    const c = document.getElementById('content');
    c.replaceChildren();
    c.style.top = '';
    const items = String(d.items || '').split('|').map((x) => x.trim()).filter(Boolean);
    const layout = LAYOUTS[d.layout] ? d.layout : 'question';
    await document.fonts.ready;
    LAYOUTS[layout](c, d, items);
  };
  drawGrid();
  const fromHash = () => { if (location.hash.length > 1) window.renderCard(JSON.parse(decodeURIComponent(location.hash.slice(1)))); };
  window.addEventListener('hashchange', fromHash);
  fromHash();
</script>
</body>
</html>
